[project]
name = "careerpilot-ai"
version = "0.1.0"
description = "Local job discovery, ranking, and application-assistance tool"
requires-python = ">=3.10,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
markers = [
    "live: requires external job-source or Ollama access; excluded from the automated suite",
]
