<!DOCTYPE html>
<html>

<head>

    <title>CareerPilot AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h1>CareerPilot AI</h1>

<hr>

{% for item in jobs %}

<div class="card mb-3">

<div class="card-body">

<h4>

{{ item.job.title }}

</h4>

<p>

<b>Company:</b>

{{ item.job.company }}

</p>

<p>

<b>Location:</b>

{{ item.job.location }}

</p>

<p>

<b>Match:</b>

{{ item.match_score }}%

</p>

<p>

{{ item.job.source }}

</p>

</div>

</div>

{% endfor %}

</div>

</body>

</html>
